[project]
name = "replica"
version = "0.1.0"
description = "Articraft rebuilt from scratch, one step at a time."
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "build123d>=0.9",
    "manifold3d>=3.5.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Not an installable package (yet): code is imported from the project root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
